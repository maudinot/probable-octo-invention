<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octo Invention – Test UI</title>
<style>
  :root {
    --bg: #fafafa; --card: #fff; --border: #e0e0e0;
    --text: #222; --muted: #666; --accent: #3b82f6; --accent-hover: #2563eb;
    --ok: #22c55e; --err: #ef4444; --code-bg: #1e1e1e; --code-fg: #d4d4d4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--text); color: #fff; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.25rem; font-weight: 600; }
  header .server-info { font-size: .85rem; opacity: .85; }
  .container { max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .card h2 { font-size: .95rem; padding: .75rem 1rem; background: #f5f5f5; border-bottom: 1px solid var(--border); }
  .card-body { padding: 1rem; }
  label { display: block; font-size: .8rem; font-weight: 500; margin-bottom: .25rem; color: var(--muted); }
  input, select { width: 100%; padding: .45rem .65rem; border: 1px solid var(--border); border-radius: 4px; font-size: .875rem; margin-bottom: .6rem; background: var(--card); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,.2); }
  button { background: var(--accent); color: #fff; border: none; border-radius: 4px; padding: .5rem 1.2rem; font-size: .85rem; cursor: pointer; transition: background .15s; }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.secondary { background: #f3f4f6; color: var(--text); }
  button.secondary:hover { background: #e5e7eb; }
  button.sm { padding: .35rem .75rem; font-size: .8rem; }
  .row { display: flex; gap: .5rem; align-items: flex-end; }
  .row input { flex: 1; margin-bottom: 0; }
  .row button { flex-shrink: 0; margin-bottom: 0; }
  pre { background: var(--code-bg); color: var(--code-fg); padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: .82rem; line-height: 1.5; max-height: 320px; overflow-y: auto; }
  pre::-webkit-scrollbar { width: 6px; height: 6px; }
  pre::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
  .response-area { margin-top: .75rem; }
  .response-area .label { font-size: .75rem; color: var(--muted); margin-bottom: .25rem; }
  .status { display: inline-block; padding: .15rem .5rem; border-radius: 3px; font-size: .75rem; font-weight: 600; }
  .status.ok { background: #dcfce7; color: var(--ok); }
  .status.err { background: #fef2f2; color: var(--err); }
  .status.pending { background: #fef9c3; color: #a16207; }
  .file-item { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid var(--border); font-size: .85rem; }
  .file-item:last-child { border-bottom: none; }
  .file-id { color: var(--accent); font-weight: 600; min-width: 30px; }
  .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { color: var(--muted); font-size: .75rem; }
  .file-actions { display: flex; gap: .3rem; }
  .full-width { grid-column: 1 / -1; }
  .auth-bar { background: #f0f9ff; padding: .5rem 1rem; border-bottom: 1px solid var(--border); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  .auth-bar label { margin-bottom: 0; display: flex; align-items: center; gap: .35rem; font-weight: 600; }
  .auth-bar input { width: auto; margin-bottom: 0; }
  .auth-bar .val { font-size: .8rem; color: var(--muted); font-family: monospace; }
  .toggle-row { display: flex; align-items: center; gap: .4rem; font-size: .85rem; }
  .toggle-row input[type=checkbox] { width: auto; flex: 0; margin: 0; }
</style>
</head>
<body>

<header>
  <h1>Octo Invention</h1>
  <div class="server-info">API Server: <span id="serverUrlDisplay">localhost:8080</span></div>
</header>

<div class="container">
  <div class="grid">

    <!-- ===== USERS ===== -->
    <div class="card">
      <h2>User Management</h2>
      <div class="card-body">
        <div class="row">
          <div><label for="userName">Name</label><input id="userName" type="text" value="testuser"></div>
          <div><label for="userPass">Password</label><input id="userPass" type="text" value="secret"></div>
        </div>
        <button id="btnRegister" onclick="registerUser()">Register User</button>
        <div id="registerResp" class="response-area"><span class="status pending">idle</span></div>
        <hr style="margin:.8rem 0;border:none;border-top:1px solid var(--border)">
        <div class="row">
          <div style="flex:1"><label for="delUserId">operator id</label>
            <input id="delUserId" type="text" value="testuser"></div>
          <button id="btnDeleteUser" onclick="deleteUser()">Delete</button>
        </div>
        <div id="deleteResp" class="response-area"><span class="status pending">idle</span></div>
      </div>
    </div>

    <!-- ===== FILE LIST ===== -->
    <div class="card">
      <h2>Files</h2>
      <div class="card-body" style="padding-top:.5rem;">
        <button class="sm secondary" onclick="fetchFiles()">Refresh List</button>
        <div id="fileList" style="margin-top:.6rem; max-height:340px; overflow-y:auto;">
          <p style="font-size:.82rem;color:var(--muted);">No files loaded yet.</p>
        </div>
      </div>
    </div>

    <!-- ===== UPLOAD ===== -->
    <div class="card full-width">
      <h2>Upload File</h2>
      <div class="auth-bar">
        <label>Auth: username <input id="uploadUser" type="text" value="admin" style="width:100px"> / password <input id="uploadPass" type="text" value="admin" style="width:100px"></label>
        <span style="font-size:.7rem;color:var(--muted)">(auto Basic auth)</span>
      </div>
      <div class="card-body">
        <div class="row">
          <div><label for="uploadFileName">X-FileName</label><input id="uploadFileName" type="text" value="test.txt"></div>
          <input id="uploadBody" type="text" value="Hello, Octo!" placeholder="Raw body content (or paste JSON)">
        </div>
        <div style="margin-bottom:.6rem;">
          <label for="uploadFileInput">Or pick a local file:</label>
          <input id="uploadFileInput" type="file" onchange="onFileSelect(this)">
        </div>
        <button id="btnUpload" onclick="uploadFile()">Upload</button>
        <div id="uploadResp" class="response-area"><span class="status pending">idle</span></div>
      </div>
    </div>

    <!-- ===== GET FILE META ===== -->
    <div class="card">
      <h2>Get File Metadata</h2>
      <div class="card-body">
        <div class="row">
          <div style="flex:1"><label for="getFileId">id</label><input id="getFileId" type="text" value="1"></div>
          <button class="sm" onclick="getFileMeta()">Fetch</button>
        </div>
        <div id="getFileMetaResp" class="response-area"><span class="status pending">idle</span></div>
      </div>
    </div>

    <!-- ===== DOWNLOAD ===== -->
    <div class="card">
      <h2>Download File</h2>
      <div class="card-body">
        <div class="row">
          <div style="flex:1"><label for="downloadFileId">id</label><input id="downloadFileId" type="text" value="1"></div>
          <button class="sm" onclick="downloadFile()">Download</button>
        </div>
        <div id="downloadResp" class="response-area"><span class="status pending">idle</span></div>
      </div>
    </div>

    <!-- ===== RAW REQUEST ===== -->
    <div class="card full-width">
      <h2>Raw Request</h2>
      <div class="card-body">
        <div class="row">
          <div style="flex:1"><label for="rawMethod">Method</label>
            <select id="rawMethod">
              <option value="GET" selected>GET</option>
              <option value="POST">POST</option>
              <option value="PUT">PUT</option>
              <option value="DELETE">DELETE</option>
              <option value="PATCH">PATCH</option>
            </select>
          </div>
          <div style="flex:2"><label for="rawPath">Path</label><input id="rawPath" type="text" value="/api/files"></div>
          <button class="sm" onclick="rawRequest()">Send</button>
        </div>
        <textarea id="rawBody" rows="4" style="width:100%;margin-top:.4rem;padding:.5rem;border:1px solid var(--border);border-radius:4px;font-family:monospace;font-size:.82rem;" placeholder="Optional JSON body"></textarea>
        <div id="rawResp" class="response-area"><span class="status pending">idle</span></div>
      </div>
    </div>

  </div>
</div>

<script>
const SERVER = (location.host || 'localhost:8080');
$('userName').value = 'testuser';
$('userPass').value = 'secret';
$('delUserId').value = 'testuser';
$('getFileId').value = '1';
$('downloadFileId').value = '1';

function $(id) { return document.getElementById(id); }
function setStatus(el, status, body) {
  el.innerHTML = `<span class="status ${status}">${status.toUpperCase()}</span>`;
  if (body) { el.innerHTML += `<pre class="resp-body">${body}</pre>`; }
  el.scrollIntoView({ block: 'nearest' });
}
function showStatus(el, bodyTag) {
  el.innerHTML = `<span class="status pending">loading...</span>`;
  return el;
}

// — User registration —
async function registerUser() {
  const el = $('registerResp');
  showStatus(el);
  try {
    const res = await fetch(`http://${SERVER}/api/users`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: $('userName').value, password: $('userPass').value })
    });
    const ct = res.headers.get('content-type') || '';
    const bodyTag = ct.includes('json') ? await res.text() : `${res.status} ${res.statusText}`;
    setStatus(el, res.ok ? 'ok' : 'err', JSON.stringify(JSON.parse(bodyTag), null, 2));
    el.querySelector('.status') && el.querySelector('.status').classList.add(res.ok ? 'ok' : 'err');
  } catch (e) { setStatus(el, 'err', e.message); }
}

// — User deletion —
async function deleteUser() {
  const el = $('deleteResp');
  showStatus(el);
  try {
    const id = $('delUserId').value;
    const res = await fetch(`http://${SERVER}/api/users/${id}`, { method: 'DELETE' });
    const bodyTag = res.status === 204 ? '<em>204 No Content</em>' : await res.text();
    setStatus(el, res.ok || res.status === 204 ? 'ok' : 'err', bodyTag);
  } catch (e) { setStatus(el, 'err', e.message); }
}

// — Fetch file list —
async function fetchFiles() {
  const el = $('fileList');
  el.innerHTML = '<p style="font-size:.82rem;color:var(--muted);">Loading...</p>';
  try {
    const res = await fetch(`http://${SERVER}/api/files`);
    if (!res.ok) { el.innerHTML = `<p style="color:var(--err);">${res.status} ${res.statusText}</p>`; return; }
    const data = await res.json();
    if (!data.length) { el.innerHTML = '<p style="font-size:.82rem;color:var(--muted);">No files found.</p>'; return; }
    el.innerHTML = data.map(f => `
      <div class="file-item">
        <span class="file-id">#${f.id}</span>
        <span class="file-name">${f.name}</span>
        <span class="file-meta">${(f.size||0)}B · ${f.status}</span>
        <span class="file-meta">${f.uploadDate?.slice(0,10)||''}</span>
        <div class="file-actions">
          <button class="sm" onclick=$('getFileId').value=${f.id};getFileMeta()>Meta</button>
          <button class="sm" onclick=$('downloadFileId').value=${f.id};downloadFile()>Dl</button>
        </div>
      </div>`).join('');
  } catch (e) { el.innerHTML = `<p style="color:var(--err);">${e.message}</p>`; }
}

// — Get file metadata —
async function getFileMeta() {
  const el = $('getFileMetaResp');
  showStatus(el);
  try {
    const id = $('getFileId').value;
    const res = await fetch(`http://${SERVER}/api/files/${id}`);
    const bodyTag = res.ok ? JSON.stringify(await res.json(), null, 2) : await res.text();
    setStatus(el, res.ok ? 'ok' : 'err', bodyTag);
  } catch (e) { setStatus(el, 'err', e.message); }
}

// — Download file —
async function downloadFile() {
  const el = $('downloadResp');
  showStatus(el);
  try {
    const id = $('downloadFileId').value;
    const res = await fetch(`http://${SERVER}/api/files/${id}/download`);
    if (!res.ok) { setStatus(el, 'err', `${res.status} ${res.statusText}`); return; }
    const blob = await res.blob();
    const type = res.headers.get('content-type') || 'application/octet-stream';
    // show first 4000 chars if text
    const textPreview = type.startsWith('text/') ? await blob.text() : `[${blob.size} bytes] ${type}`;
    setStatus(el, 'ok', textPreview);
    // Also trigger actual download
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `file-${id}`; a.click();
    URL.revokeObjectURL(url);
  } catch (e) { setStatus(el, 'err', e.message); }
}

// — Upload file —
function onFileSelect(input) {
  if (!input.files.length) return;
  const reader = new FileReader();
  reader.onload = () => $('uploadBody').value = reader.result;
  $('uploadFileName').value = input.files[0].name;
}

function btoaUnicode(s) {
  return btoa(unescape(encodeURIComponent(s)));
}

async function uploadFile() {
  const el = $('uploadResp');
  showStatus(el);
  try {
    const user = $('uploadUser').value;
    const pass = $('uploadPass').value;
    const auth = 'Basic ' + btoaUnicode(`${user}:${pass}`);
    const body = $('uploadBody').value;
    const fileName = $('uploadFileName').value || 'upload';
    const res = await fetch(`http://${SERVER}/api/files`, {
      method: 'POST',
      headers: {
        'Authorization': auth,
        'X-FileName': fileName,
        'Content-Type': 'text/plain'
      },
      body: body
    });
    const bodyTag = res.ok ? JSON.stringify(await res.json(), null, 2) : await res.text();
    setStatus(el, res.ok ? (res.status === 202 ? 'ok (202)' : 'ok') : 'err', bodyTag);
    // Refresh file list
    fetchFiles();
  } catch (e) { setStatus(el, 'err', e.message); }
}

// — Raw request —
async function rawRequest() {
  const el = $('rawResp');
  showStatus(el);
  try {
    const method = $('rawMethod').value;
    const path = $('rawPath').value;
    const bodyVal = $('rawBody').value;
    const hasBody = ['POST','PUT','PATCH'].includes(method);
    const headers = { 'Content-Type': 'application/json' };
    const opts = { method, headers };
    if (hasBody && bodyVal.trim()) opts.body = bodyVal;
    const res = await fetch(`http://${SERVER}${path}`, opts);
    const ct = res.headers.get('content-type') || '';
    const bodyTag = ct.includes('json') ? JSON.stringify(await res.json(), null, 2) : (method === 'DELETE' && res.status===204 ? '<em>204 No Content</em>' : await res.text());
    setStatus(el, res.ok ? 'ok' : 'err', `${res.status} ${res.statusText}\n\n${bodyTag}`);
  } catch (e) { setStatus(el, 'err', e.message); }
}

// initial load
fetchFiles();
</script>
</body>
</html>
