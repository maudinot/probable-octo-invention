spring:
  application:
    name: octo-invention
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/postgres
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop
      dialect: org.hibernate.dialect.PostgreSQLDialect
      properties:
        hibernate:
          format_sql: true
          show_sql: true

  profiles:
    active: local

server:
  port: 8080

file:
  storage:
    url: ${MINIO_URL:http://localhost:9000}
    accessKey: minioadmin
    secretKey: minioadmin
    bucket: octo-invention-files
    upload:
      maxSize: 10485760

minio:
  client:
    url: ${file.storage.url}
    accessKey: ${file.storage.accessKey}
    secretKey: ${file.storage.secretKey}
    bucket: ${file.storage.bucket}

security:
  basic:
    username: admin
    password: admin